name: Latest blog posts

on:
  schedule:
    # 每 6 小时同步一次，另支持手动触发
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest posts into README
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://blog.munan.wang/rss.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
          commit_message: "chore: sync latest blog posts"
